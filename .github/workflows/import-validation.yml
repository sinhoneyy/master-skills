name: Import Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-validation:
    name: Validate vendored harness and npm contents
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Check imported harness contracts if present
        run: |
          if [[ -f skills/product-design-harness/SKILL.md ]]; then
            python -m pip install -r skills/product-design-harness/resources/requirements-dev.txt
            python .github/scripts/validate_product_harness.py
          else
            echo "Product Design Harness not in this tree; validation is deferred until import."
          fi
      - name: Test that npm ignores generated bytecode
        run: |
          if [[ -d skills/product-design-harness/resources/scripts ]]; then
            mkdir -p skills/product-design-harness/resources/scripts/__pycache__
            printf 'generated CI test artifact\n' > skills/product-design-harness/resources/scripts/__pycache__/packaging-probe.pyc
          fi
      - name: Verify packed npm contents and local CLI install
        run: python .github/scripts/smoke_package.py
