name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-manifest:
    name: Validate skills_index.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate manifest against the skills/ tree
        run: python .github/scripts/validate_manifest.py

      - name: Security regression tests and bundle consistency
        run: |
          python -B -m unittest discover -s tests -v
          python -B .github/scripts/sync_bundles.py --check
          node --test tests/*.test.mjs
