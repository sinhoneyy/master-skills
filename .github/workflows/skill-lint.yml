name: Skill Lint

on:
  pull_request:
    # "edited" allows maintainers to initiate a fresh run after updating CI,
    # even if an external contributor has not pushed new commits.
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - "**/SKILL.md"
      - "skills/**"

permissions:
  contents: read

jobs:
  lint:
    name: Lint changed SKILL.md files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Collect changed SKILL.md files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git diff --name-only --diff-filter=ACMR "$base" "$GITHUB_SHA" -- '**/SKILL.md' > changed.txt
          echo "Changed SKILL.md files:"
          cat changed.txt

      - name: Lint
        run: |
          mapfile -t files < changed.txt
          python .github/scripts/lint_skill.py "${files[@]}"

      # Always publish diagnostics even if validation fails. Fork PRs do not
      # have access to a writable token, so do not attempt PR comments.
      - name: Publish lint report to Actions summary
        if: always()
        run: |
          if [[ -f lint-report.md ]]; then
            cat lint-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No lint report generated; inspect the preceding step logs." >> "$GITHUB_STEP_SUMMARY"
          fi
