name: Import Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-validation:
    name: Validate vendored harness and npm contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check imported harness contracts if present
        run: |
          if [[ -f skills/product-design-harness/SKILL.md ]]; then
            python -m pip install -r skills/product-design-harness/resources/requirements-dev.txt
            python .github/scripts/validate_product_harness.py
          else
            echo "Product Design Harness not in this tree; validation is deferred until import."
          fi
      - name: Verify packed npm contents and local CLI install
        run: python .github/scripts/smoke_package.py
