name: HOL Security Scan

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Same action, scanner 3.0.123, and settings as centralized run 40103003701.
      # The action verifies the scanner wheel hash and PyPI provenance.
      - uses: hashgraph-online/ai-plugin-scanner-action@8ed9b2b11cf4f242ea752117128956fcd9cca5d1 # v1.2.797
        with:
          plugin_dir: .
          mode: scan
          profile: default
          min_score: 80
          fail_on_severity: none
          trust_repository_policy: false
          online: false
          upload_sarif: false
          pr_comment: off
          cisco_skill_scan: auto
          install_cisco: false
