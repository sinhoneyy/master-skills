name: HOL Security Scan

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same action, scanner 3.0.123, and settings as centralized run 40103003701.
      # The action verifies the scanner wheel hash and PyPI provenance.
      - uses: hashgraph-online/ai-plugin-scanner-action@37a0b7035b989c0bcd1177dd7f6c77b49dab7c2f # v1.2.809
        with:
          plugin_dir: .
          mode: scan
          profile: default
          min_score: 80
          fail_on_severity: none
          trust_repository_policy: false
          online: false
          upload_sarif: false
          pr_comment: off
          cisco_skill_scan: auto
          install_cisco: false
